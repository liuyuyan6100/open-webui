# Open WebUI Nginx 反向代理模板
# 状态：模板文件，默认不启用。
# 启用前必须：
# 1. 将 server_name 改成实际已解析到本机的域名，例如 openweb.aiclawonline.website
# 2. 申请证书：sudo certbot --nginx -d <domain>
# 3. 确认不会覆盖 hermes.aiclawonline.website / chat.aiclawonline.website 等现有站点

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    # 如 certbot 管理 HTTPS，可保留 ACME 路径。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.example.com;

    # 启用前替换为 certbot 生成的实际证书路径。
    ssl_certificate /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    # Open WebUI 需要支持 WebSocket / SSE / 长连接。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
