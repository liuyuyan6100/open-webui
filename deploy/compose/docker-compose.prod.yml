services:
  open-webui:
    image: ${APP_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ../env/.env.prod
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      # 明确透传关键变量，便于 docker compose config 输出核查。
      - WEBUI_NAME=${WEBUI_NAME:-My AI WebUI}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-*}
      - SCARF_NO_ANALYTICS=${SCARF_NO_ANALYTICS:-true}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-true}
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-false}
    volumes:
      - ${OPEN_WEBUI_VOLUME:-open-webui-data}:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - open-webui-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || curl -fsS http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  open-webui-data:

networks:
  open-webui-net:
    driver: bridge
